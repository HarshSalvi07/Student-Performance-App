version: "3.9"

services:

  db:
    image: mysql:latest
    container_name: mysql-container
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: fastapi_db
    volumes:
      - ./data:/var/lib/mysql

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: student-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./back-end/src/uploads:/app/src/uploads
      - ./back-end/data:/app/data
    restart: unless-stopped